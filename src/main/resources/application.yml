spring:
  flyway:
    enabled: false
  application:
    name: drogueria-bellavista

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Bogota

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
      base-path: /actuator
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: 86400000
  mail:
    from: ${MAIL_FROM:noreply@bellavista.com}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

# Documentación OpenAPI / Swagger UI  →  /api/swagger-ui/index.html
springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
