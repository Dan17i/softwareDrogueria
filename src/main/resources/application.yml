spring:
  application:
    name: drogueria-bellavista

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Bogota

  # Email configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration: 86400000
  mail:
    from: ${MAIL_FROM:noreply@bellavista.com}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}

  # Redis configuration for token blacklist
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: ${REDIS_TIMEOUT:2000ms}
    jedis:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        timeout: 2000ms

# Configuración de Redis en Spring Data
spring:
  data:
    redis:
      host: ${app.redis.host}
      port: ${app.redis.port}
      password: ${app.redis.password}
      timeout: ${app.redis.timeout}
      jedis:
        pool:
          max-active: ${app.redis.jedis.pool.max-active}
          max-idle: ${app.redis.jedis.pool.max-idle}
          min-idle: ${app.redis.jedis.pool.min-idle}
          timeout: ${app.redis.jedis.pool.timeout}
