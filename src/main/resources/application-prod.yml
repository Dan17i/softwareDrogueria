# application-prod.yml MEJORADO
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway (db/migration). Cambiar a validate tras comparar el esquema real de prod.
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    # BD existente (creada con ddl-auto=update): se marca como V1 sin ejecutar el script
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: redis
      port: 6379

  # Email prod: SES SMTP (email-smtp.<REGION>.amazonaws.com:587, credenciales SMTP). Sin defaults: falla al arrancar si faltan.
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: 86400000
  mail:
    from: ${MAIL_FROM}
  frontend:
    url: ${FRONTEND_URL:https://drogueria-bellavista.netlify.app}
  stripe:
    api:
      key: ${STRIPE_SECRET_KEY}
      public-key: ${STRIPE_PUBLIC_KEY}

logging:
  level:
    root: WARN
    com.drogueria.bellavista: INFO
    
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    db:
      enabled: false
    mail:
      enabled: false