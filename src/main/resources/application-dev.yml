spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/drogueria_bellavista
    username: postgres
    password: ${DEV_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  # Email dev: credenciales por variables de entorno (nunca en el repo)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-not-for-production-0123456789}
  mail:
    from: ${MAIL_FROM:noreply@localhost}
  frontend:
    url: http://localhost:5173
  stripe:
    api:
      # Configura las claves en el archivo .env (ver .env.example)
      key: ${STRIPE_SECRET_KEY}
      public-key: ${STRIPE_PUBLIC_KEY}

logging:
  level:
    root: INFO
    com.drogueria.bellavista: DEBUG
    org.springframework.mail: DEBUG  # ← Para ver logs de email