services:
  postgres:
    image: postgres:15-alpine
    container_name: drogueria_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: drogueria_bellavista
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - drogueria_net
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d drogueria_bellavista"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  app:
    # `docker compose up --build` construye la imagen local; en servidor se usa la publicada en GHCR
    build: .
    image: ghcr.io/dan17i/softwaredrogueria:latest
    container_name: drogueria_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/drogueria_bellavista
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST requerido (servidor SMTP)}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME requerido (usuario SMTP)}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD requerido (password SMTP)}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM requerido (remitente verificado)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      APP_DOCS_PUBLIC: ${APP_DOCS_PUBLIC:-false}
    ports:
      - "8080:8080"
    networks:
      - drogueria_net
    mem_limit: 512m
    mem_reservation: 256m

  redis:
    image: redis:7-alpine
    container_name: drogueria_redis
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - drogueria_net

networks:
  drogueria_net:
    driver: bridge

volumes:
  postgres_data:
