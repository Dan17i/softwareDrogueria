server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # El backend vive bajo el context-path /api: se reenvía tal cual.
    # X-Forwarded-For permite que el rate limit vea la IP real (server.forward-headers-strategy=native).
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre: cache largo
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: cualquier ruta del front (/productos, /reset-password...) devuelve index.html
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
