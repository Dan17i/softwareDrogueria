name: CI/CD — Droguería Bellavista
on:
  push:
    branches: [ main ]
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/dan17i/softwaredrogueria
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa7c6e08c2d87be1f7a
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build JAR con Maven
        run: mvn package -DskipTests
      - name: Login a GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7ffe25e78
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build y Push imagen Docker
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c8
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
      - name: Deploy en EC2 vía SSH
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a0a9d56
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/softwareDrogueria
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u dan17i --password-stdin
            docker compose pull app
            docker compose up -d --no-deps app
            docker image prune -f
